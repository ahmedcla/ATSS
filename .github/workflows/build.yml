name: Build mod from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the mod
        run: |
          mkdir -p _src
          unzip -q -o ./*.zip -d _src
          GRADLEW=$(find _src -name gradlew -not -path "*/__MACOSX/*" | head -n 1)
          test -n "$GRADLEW" || { echo "gradlew not found inside the zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload
